# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

# Module Name (optional)
# ----------------------
# Set this if your importable module name differs from the project name.
# Example: project 'py-yaml12' with module name 'yaml12'
# module: yaml12

# Docstring Parser
# ----------------
# The docstring format used in your package (numpy, google, or sphinx)
parser: numpy

# Dynamic Introspection
# ---------------------
# Use runtime introspection for more accurate documentation (default: true).
# Set to false here on purpose: most of the documented API lives in submodules
# (`gallery.*`, `kernels.*`, `kernels.harness.*`) that griffe's dynamic loader
# can't reach as attributes of the top-level `ibnr` module, so it would fail on
# the first submodule member and fall back to static analysis for the whole
# reference anyway. Static analysis reads these plain defs correctly with no
# warning; flip back to true if the public API ever flattens onto `ibnr`.
dynamic: false

# Project links & hero
# --------------------
repo: https://github.com/EKtheSage/ibnr
tagline: >
  Probabilistic loss reserving with mandatory evaluation - Bayesian MCMC,
  neural, and statistical methods over a long-format triangle data layer,
  and the chain ladder, Bornhuetter-Ferguson, Cape Cod and Mack in ibnr.methods.

