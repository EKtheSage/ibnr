# API Reference Structure
# -----------------------
# Customize the sections below to organize your API documentation.
# - Reorder items within a section to change their display order
# - Move items between sections or create new sections
# - Use 'members: false' to exclude methods from documentation
# - Add 'desc:' to sections for descriptions

reference:
  - title: Reserving methods
    desc: >
      The front door for the traditional methods: one function per method,
      named after it, on one triangle's cells given as any Arrow-readable table
      (a polars DataFrame or a pyarrow Table). Import with
      `from ibnr import methods`. Results are pyarrow Tables, and
      ReserveResult.to_polars() gives any of them as a polars DataFrame.
      Coming from chainladder-python, see
      [the lookup table](https://github.com/EKtheSage/ibnr/blob/main/docs/coming-from-chainladder.md).
    contents:
      - methods.chain_ladder
      - methods.mack
      - methods.bornhuetter_ferguson
      - methods.cape_cod
      - name: methods.ReserveResult
        members: true

  - title: Triangle
    desc: >
      The long-format triangle data layer - a tidy table of
      origin_period / dev_lag / eval_date cells over an ibis expression
      (duckdb or polars backend), carrying grain, cumulative/incremental,
      and units metadata.
    contents:
      - name: Triangle
        members: false  # methods documented in their own section below
      - TriangleMeta

  - title: Triangle transforms & interop
    desc: >
      Cumulative/incremental conversion, grain changes, as_of() backtest
      slicing, and lossless round-trips with chainladder-python and bermuda.
    contents:
      - Triangle.from_long
      - Triangle.from_chainladder
      - Triangle.to_chainladder
      - Triangle.from_bermuda
      - Triangle.to_bermuda
      - Triangle.to_cumulative
      - Triangle.to_incremental
      - Triangle.with_dev_grain
      - Triangle.with_origin_grain
      - Triangle.as_of
      - Triangle.latest_diagonal
      - Triangle.filter
      - Triangle.select_fields
      - Triangle.to_wide
      - Triangle.to_pandas
      - Triangle.to_polars
      - Triangle.execute
      - Triangle.count
      - Triangle.with_expr
      - Triangle.validate

  - title: Gallery
    desc: >
      Discover, retrieve, and fit reserving models through the GalleryEntry
      contract. Every entry - Bayesian, neural, or statistical - produces a
      PredictiveDistribution.
    contents:
      - gallery.list
      - gallery.get
      - gallery.fit
      - name: gallery.GalleryEntry
        members: true

  - title: Held-out evaluation
    desc: >
      The four steps between a fitted entry and a leaderboard row: which cells
      a fit at as_of is scored on, one model's arrays at those cells, the
      cross-model intersection, and the board.
    contents:
      - gallery.next_diagonal
      - name: gallery.CohortForecast
        members: true
      - gallery.Absence
      - gallery.align_panel
      - gallery.leaderboard
      - gallery.reserve_rows
      - gallery.SCORE_DIRECTION
      - gallery.stack

  - title: Chain ladder & reserve risk
    desc: >
      The distribution-free chain ladder (Mack 1993) and its run-off MSEP,
      plus the one-year claims development result - the Solvency II reserve-risk
      view. cdr_methods() is the option surface: which model generates next
      year's diagonal, how the reserve is re-estimated once it exists, and what
      each route has actually been validated against.
    contents:
      - name: kernels.MackFit
        members: true
      - kernels.fit_mack
      - kernels.fit_mack_grid
      - kernels.cohort_grid_frame
      - kernels.simulate_ultimates
      - kernels.cdr_methods
      - kernels.get_cdr_method
      - kernels.one_year_cdr
      - kernels.simulate_one_year_cdr
      - kernels.rereserve
      - kernels.cdr_risk_measures
      - name: kernels.CDRResult
        members: true
      - kernels.MackDiagonal
      - kernels.ODPBootstrapDiagonal
      - gallery.GalleryDiagonal

  - title: Conventional point candidates
    desc: >
      Chain ladder, Bornhuetter-Ferguson and Gluck's generalized Cape Cod as
      fixed settings that can be refitted at successive information dates. A
      replay measures each candidate's realized actual-versus-expected and the
      observed change in its fitted ultimate over one development period;
      selection picks a candidate on those historical outcomes alone, and the
      evaluation scores the frozen forecast against later terminal observations.
    contents:
      - kernels.fit_conventional
      - kernels.fit_conventional_grid
      - kernels.conventional_grid
      - name: kernels.ConventionalCandidate
        members: true
      - name: kernels.ConventionalFit
        members: true
      - kernels.replay_conventional
      - kernels.ConventionalReplay
      - kernels.score_replay
      - kernels.select_conventional
      - kernels.ConventionalSelection
      - kernels.evaluate_conventional
      - kernels.ConventionalEvaluation

  - title: Evaluation kernels
    desc: >
      The unifying predictive-distribution output type, the cross-backend
      posterior-parity tooling, and the point-error metrics - which take the
      level errors are summed within as an argument, because summing before
      the absolute value is where one line's overestimate cancels another's
      underestimate.
    contents:
      - name: kernels.PredictiveDistribution
        members: true
      - kernels.ParityReport
      - kernels.compare_posteriors
      - kernels.point_metrics
      - kernels.level_errors
      - kernels.shrink_toward
      - kernels.point_summary

  - title: Residual calibration
    desc: >
      Historical uncertainty for a point forecaster: apply it at earlier
      cutoffs, pool the standardised errors by unit size, and resample them
      around the final point.
    contents:
      - kernels.rolling_residuals
      - kernels.calibrate
      - name: kernels.Calibration
        members: true
      - kernels.calibrated_draws
      - kernels.leave_one_out_coverage

  - title: Wire format
    desc: >
      The single place an ibnr result becomes bytes - one Arrow IPC stream per
      artifact, uncompressed by default, plus a one-way JSON summary for callers
      that cannot take the draws.
    contents:
      - kernels.to_arrow
      - kernels.from_arrow
      - kernels.peek_kind
      - kernels.to_summary
      - kernels.CODEC_VERSION
      - kernels.CONTENT_TYPE_ARROW
      - kernels.CONTENT_TYPE_JSON
      - kernels.DEFAULT_QUANTILES

  - title: Retrospective harness
    desc: >
      Parallel company x line backtesting with staged sampler escalation -
      the compute seam behind the study scripts.
    contents:
      - kernels.harness.run_retro
      - kernels.harness.run_task
      - kernels.harness.RetroTask
      - kernels.harness.SamplerSettings
      - kernels.harness.ConvergenceGates
      - kernels.harness.precompile
      - kernels.harness.default_max_workers

