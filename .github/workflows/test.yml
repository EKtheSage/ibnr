name: Tests

# There was no pytest workflow in this repository at all until this file, so a
# green check mark on a pull request meant "ruff passed and the docs built" and
# nothing more. Every test here had only ever run on one Windows laptop, by hand.
#
# Running pytest is the easy half. The hard half is making a green run MEAN
# something, because in this repository a run can look fine while telling you
# almost nothing. Nearly every optional dependency is guarded with
# pytest.importorskip, and a guard that fires does not fail - it skips. TEN
# test files (test_deeptriangle, test_mdn, test_nn_heldout, test_nn_heldout_cutoff,
# test_nn_heldout_premium, test_nn_segment_contract, test_nn_training_context,
# test_nn_transformer, test_nn_transformer_ml, test_resnet) call
# importorskip("torch") at MODULE
# level, and a module-level skip collapses a whole file into a single "s". A
# developer who runs `uv sync && uv run pytest` gets a fully green run in which
# the nn tests, the bayesian tests and the polars half of the backend matrix
# never execute. Measured: a core-only environment reports 557 passed and 204
# skipped, and every one of those 204 is silent.
#
# So every leg here declares what it installed and what it must run, and a check
# step after pytest reads the JUnit XML and fails the job on any of:
#
#   * a test was skipped because a package THIS LEG INSTALLED could not be
#     imported - i.e. the install silently did not take;
#   * a file this leg exists to exercise contributed ZERO executed tests,
#     whether it was collection-skipped, renamed, or deleted;
#   * fewer tests executed than a coarse floor.
#
# The middle one is the one with real teeth. Read the floors for what they are:
# COLLAPSE DETECTORS, not delta checks. Every leg re-runs the same ~557 core
# tests, so an extra's unique contribution (bayesian is +45) is smaller than the
# cushion most of these floors carry: on those legs no global count can notice
# that all twelve bayesian files were deleted. That is what required_files is
# for, and why it names every file whose absence is the thing the leg was built
# to prevent.
#
# The bayesian leg is the single exception, and deliberately so: its floor is
# squeezed between the core count and its own, which is the only way a global
# count can catch a whole family of tests going missing. Read the comment on
# that leg before touching either number - it is also the only floor here that
# goes stale simply because CORE tests were added.
#
# Both skip shapes had to be handled, because they differ. A MODULE-level
# importorskip emits a single <testcase classname="" name="tests.test_mdn">
# whose <skipped message="collection skipped"> carries the real reason in its
# element TEXT. The bayesian files guard at FUNCTION level and so always collect
# and skip individually. "At least one executed test per named file" is the one
# rule that covers both.
#
# The matrix has three parts that do different jobs:
#
#   * The isolated legs (core, core-py311, polars, nn, bayesian, interop)
#     install the core dependencies plus exactly ONE extra. This is CLAUDE.md's
#     "CI matrix runs core and each extra in isolation to catch hidden imports".
#     The core leg asserts the optional packages really are absent, so a
#     module-level `import torch` anywhere on the `import ibnr` path fails here
#     instead of shipping. That same isolation is why these legs cannot demand
#     zero skips: a leg without polars is SUPPOSED to skip the polars half of
#     the backend matrix.
#
#   * The `all` leg installs everything and makes the strong claim, so it runs
#     in strict mode: it enumerates the only skip reasons a runner may produce
#     and fails on anything else.
#
#   * The two `-latest` legs install WITHOUT the lockfile and force numpy and
#     pandas to their newest releases. Every other leg grades uv.lock, which
#     [tool.uv] override-dependencies deliberately holds somewhere a consumer
#     never lands; these two grade the floating resolution `pip install ibnr`
#     actually produces. They are allowed to break when upstream ships, and
#     that break is the point.
#
#     The first such break came on 2026-09-05, and the fix went into
#     pyproject, not into this file. sqlglot 30.18.0 renamed the `Drop`
#     expression's `this` argument to `tables`; ibis 12.0.0 still passes
#     `this`, so ibis rendered `DROP VIEW IF EXISTS` with no name and every
#     duckdb-backend `Triangle.from_long` from an in-memory frame died in
#     duckdb's parser on both floating legs - hundreds of failures each;
#     parquet paths, ibis expressions and the polars backend were unaffected,
#     and polars-latest went red on its duckdb half - while the seven locked
#     legs, on sqlglot 30.11.0, stayed green. duckdb 1.5.5 was the first
#     suspect and was cleared by pinning sqlglot alone. The answer was a
#     `sqlglot<30.18` cap in pyproject's core dependencies - NOT an extra
#     requirement on these legs' sync_args, which would have greened the leg
#     while leaving `pip install ibnr` exactly as broken, the one thing the
#     leg exists to catch. Read the cap's comment in pyproject for the
#     upstream issue and the condition for lifting it;
#     tests/test_sqlglot_cap.py names the cause if it is lifted early.
#
# On what the core leg does and does not prove about torch, because it is easy
# to read backwards: tests/test_gallery.py's subprocess check asserts `'torch'
# not in sys.modules` after importing ibnr.gallery. With torch ABSENT that
# assertion is trivially true - what this leg actually catches is the subprocess
# dying with ModuleNotFoundError. The assertion itself only has teeth where
# torch IS importable, i.e. the nn and all legs. Both are real checks; they are
# different checks. Anyone trimming this matrix for runner minutes should not
# read the core leg as covering the nn one.
#
# COST, from the first real run rather than an estimate, because someone will
# check it against the Actions tab. Billed job time: all 6m04, bayesian 4m19,
# interop 2m22, nn 2m19, polars 56s, core 50s, core-py311 48s - about 18
# runner-minutes per pull request, with wall clock set by the `all` leg at
# roughly 6 minutes. Those are the billed times of the run that graded this
# file's first commit; the test counts below have since grown (nn alone by 53
# tests), so read them as the right order of magnitude rather than current to
# the second.
#
# The two `-latest` legs were added AFTER the run above, so "roughly a minute
# each" was an estimate when first written, extrapolated from the locked core
# and polars legs (50s and 56s) plus an unlocked resolve. Measured since, on
# main's green run of 2026-08-26 (32952677125): core-latest 1m23s and
# polars-latest 1m44s wall, in line with the estimate. What was never a guess:
# neither leg installs torch or cmdstanpy, so they do belong at the cheap end.
#
# Worth knowing if these numbers are ever re-derived on a laptop: the runners
# are FASTER than the dev box for this workload, not slower. The `all` leg's
# pytest took 179s on a runner against 327s locally. An earlier version of this
# comment predicted 30-45 billed minutes by assuming the opposite, and was
# wrong by roughly a factor of two.
#
# That price buys less new information than it looks like, and it is worth
# being honest about the ratio. Every isolated leg re-runs the same ~557 core
# tests; measured with every leg built the same afternoon, the unique yield is
# nn +137, polars +128, bayesian +45, interop +29. If that stops being worth it,
# narrow the per-extra legs to their own files; do not cut `all` or the gates.
#
# On the provenance of the per-leg counts below, because it decides how much
# they can be trusted: the core and the two -latest legs were re-measured on
# THIS tree. polars, nn, bayesian, interop and all were measured on the same
# branch one base earlier, when the core leg stood at 553 rather than 557 -
# three fixes have landed on main since, and each of them added tests that run
# in every leg. So read those five totals as four-ish tests low and their DELTAS
# against core as sound; the first CI run on this branch replaces all of them
# with runner numbers, which is the only place they were ever going to be
# authoritative anyway.
#
# Deliberately NOT here, so nobody wonders whether it was forgotten:
#
#   * The slow/cmdstan job CLAUDE.md asks for. Those tests need a cmdstan
#     toolchain built on the runner, roughly ten minutes before a single test
#     runs, through an install path never once exercised on Linux. When it lands
#     it should be its own file behind workflow_dispatch or a label, with
#     -m "slow" spelled out in full and a timeout of its own.
#
#   * A `viz` leg. No test imports altair and src/ibnr/viz/ does not exist yet
#     (milestone 8). The fix is a test, not a job.
#
#   * A Windows runner, even though Windows is the only machine this suite has
#     ever run on. A real gap and a deliberate deferral: it would be the first
#     non-ubuntu runner in the repository and belongs in its own change.
#
#   * An `interop-latest` leg, and this one leaves a combination genuinely
#     UNGRADED rather than merely untested twice. `pip install ibnr[interop]`
#     resolves chainladder 0.9.2 and bermuda-ledger 2.3.0 against numpy 1.26.4
#     and pandas 2.3.3, because bermuda caps numpy below 2 and nothing outside
#     this repository overrides that (measured with `uv pip compile --no-config`
#     against this tree on 3.12, not read off a changelog). No leg here runs
#     that pair: the locked interop leg runs numpy 2.4.6,
#     which uv.lock's override-dependencies puts there precisely to step over
#     the cap, and the two floating legs are core and polars only and force
#     numpy>=2 by construction. So every tie-out this repository grades runs on
#     a numpy generation the published extra does not install. Accepted rather
#     than fixed, for now, because the override exists exactly because that cap
#     is stale upstream metadata on code that works, and because [interop] stops
#     at 3.12 anyway - but if a tie-out ever fails only for a consumer, this is
#     the first place to look, and the fix is one more unlocked leg installing
#     `-e ".[interop]"` with no numpy pin at all.
#
# No longer absent: the exhaustive import smoke test this header used to defer
# now exists as tests/test_import_purity.py, and it is in required_files on the
# legs where it must not silently vanish. It walks every submodule under a
# meta_path blocker that refuses the extras, so it runs identically in every leg
# rather than being disarmed on the one where the extras ARE installed - which
# is the leg where a new module-level `import pymc` is most likely to be written
# and least likely to be noticed.

on:
  push:
    branches:
      - main
  pull_request:

# New to this repository. Seven legs re-run on every push to a pull request
# branch, so without cancellation a force-push leaves two full matrices racing.
# Keyed on head_ref for pull requests so a branch coalesces to one run, and on
# the unique run_id for pushes to main so merges NEVER cancel each other - main
# is the branch whose green state people trust, and two merges landing close
# together must both complete.
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  # Point the Schedule P adapter at a path that cannot exist. Without this,
  # tests/test_schedule_p.py evaluates `MART_AVAILABLE = mart_available()` at
  # IMPORT time - during collection, in every job - which resolves the default
  # source `github://EKtheSage/cas-schedule-p-data-model@latest` over the
  # network, and on a cold cache downloads a parquet. Six more test modules
  # import that flag and inherit the behaviour. With this set to a plain path
  # the github branch is never taken and the mart tests skip immediately with a
  # clear reason.
  #
  # (Until 2026-08-04 that resolution shelled out to the `gh` CLI, preinstalled
  # on GitHub runners, with no timeout. It is now an anonymous HTTPS request
  # with a 60 s timeout, so the worst case is milder - but this variable is
  # still what keeps collection off the network entirely.)
  IBNR_SCHEDULE_P_WAREHOUSE: /nonexistent/schedule-p-mart

  # No GH_TOKEN or GITHUB_TOKEN is needed and none should be added. The data
  # repo is public and the adapter reaches it anonymously; the one test that
  # really talks to GitHub carries the `network` marker and is deselected by
  # pyproject's addopts on every leg, so a token could not change any outcome
  # here - it would only be a credential in a workflow with no use for one.

  # Pin the thread count so neural-network and BLAS-heavy tests take a
  # comparable time on any runner, which keeps --durations output and the floors
  # below meaningful across runs. This is about COMPARABILITY, not determinism:
  # tests/test_deeptriangle.py's exact-equality comparison is between two fits
  # in the SAME process, so the runner's core count cannot make them differ from
  # each other. If float reproducibility ever becomes the goal, the lever is
  # torch.use_deterministic_algorithms and a value of 1.
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest

    # A test job writes nothing. House style is least privilege declared at the
    # point of use, not a blanket block at the top of the file.
    permissions:
      contents: read

    # A hang budget, not a runtime budget: the slowest leg measured under four
    # minutes locally. Without this every job inherits GitHub's 360 minute
    # default, which is what a subprocess stuck on DNS would burn while printing
    # nothing.
    timeout-minutes: 30

    strategy:
      # One leg failing must not cancel the rest. When the nn leg breaks, the
      # useful question is immediately whether bayesian broke too.
      fail-fast: false
      matrix:
        include:
          # ---------------------------------------------------------------
          # SEPARATOR NOTE: every list field below is SEMICOLON separated, with
          # no exceptions. One separator everywhere, because skip reasons
          # legitimately contain commas and a mixed convention is a trap that
          # only springs the first time someone adds a second entry.
          #
          # Every count in a comment below was MEASURED on a real environment
          # built with the same `uv sync` line the leg uses, not estimated.
          # ---------------------------------------------------------------

          # core: the isolation proof. Installs nothing optional and asserts the
          # optional packages really are missing, so a module-level `import
          # torch` (or pymc, or chainladder) anywhere on the `import ibnr` path
          # fails here rather than shipping.
          #
          # tests/test_codec.py is named here because the wire format is core by
          # construction - pyarrow is a core dependency and kernels/codec.py is
          # the only module that imports it directly - so a codec that quietly
          # grew an optional import would otherwise pass this leg by collapsing
          # to a single collection skip.
          #
          # tests/test_compute_image.py is named for the mirror-image reason. It
          # checks that the packages the Dockerfile installs are enough to start
          # the scripts the image promises, and it does that by REFUSING every
          # module outside that set - so it needs no extra installed and belongs
          # on the lightest leg. It cannot skip, which means the only way it can
          # go quiet is by being renamed or deleted, and that is exactly what
          # required_files sees.
          - name: core
            python: "3.12"
            cache: "false"
            sync_args: "--no-default-groups --group test"
            expect_imports: ""
            absent_imports: "torch;polars;pymc;numpyro;jax;arviz;bayesblend;chainladder;bermuda;altair"
            forbid_skips: ""
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_core.py;tests/test_transforms.py;tests/test_gallery.py;tests/test_markdown_snippets.py;tests/test_import_purity.py;tests/test_codec.py;tests/test_compute_image.py"
            # Re-measured on the codec-hardening branch: 648 passed, 208
            # skipped, on the locked numpy 2.4.6 / pandas 2.3.3, of which
            # tests/test_codec.py is 78 executed and 10 skipped (its polars
            # parameters). This is the number every other leg's comment is a
            # delta against, so it is measured first and the rest are read
            # against it. The previous figure here was 621 / 206.
            #
            # A runner used to report ONE test fewer than this, because the dev
            # box is logged in to gh and test_schedule_p_github's live manifest
            # test ran here and skipped there. It is `network`-marked and
            # deselected everywhere as of 2026-08-04, so both machines now agree.
            # Every floor in this file still carries a cushion large enough that
            # a gap of that shape could not decide a job either way.
            min_tests: "500"

          # ---------------------------------------------------------------
          # core-py311: the same leg on the oldest Python the package claims to
          # support. requires-python is >=3.11,<3.13 and the classifiers name
          # 3.11 and 3.12, so these two legs between them cover the whole
          # declared range - until this file nothing had ever tested 3.11, the
          # only workflow touching it being the docs build.
          #
          # Checked before shipping, because "the lock was resolved on 3.12" was
          # the obvious way for this leg to fail on its first run for a reason
          # having nothing to do with the code: `uv sync --locked ... --python
          # 3.11` resolves and installs cleanly, and the suite gave 553 passed
          # / 204 skipped there - test for test identical to what 3.12 gave in
          # the same sweep. That identity is the claim worth making, and unlike
          # the totals it does not decay when a fix on main adds four tests to
          # both. So the 3.11 claim is real, not just advertised. If this leg
          # ever goes red the answer is to fix the code or the classifier -
          # never to drop --locked.
          - name: core-py311
            python: "3.11"
            cache: "false"
            sync_args: "--no-default-groups --group test"
            expect_imports: ""
            absent_imports: "torch;polars;pymc;numpyro;jax;arviz;bayesblend;chainladder;bermuda;altair"
            forbid_skips: ""
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_core.py;tests/test_transforms.py;tests/test_gallery.py;tests/test_markdown_snippets.py;tests/test_import_purity.py;tests/test_codec.py"
            min_tests: "500"

          # ---------------------------------------------------------------
          # polars: the second ibis backend, and the biggest silent-skip risk in
          # the repository. 19 test files take the `backend_name` fixture from
          # conftest.py, and without polars each runs at half coverage and
          # reports green - measured per file across this leg's junit and the
          # core leg's, test_mack.py goes 59 -> 30 and test_holdout.py 38 -> 19.
          # (12 of the 19 gain tests in THIS leg; the other seven need torch or
          # chainladder as well, and get their second backend on the `all` leg.)
          # That is the largest skip category, and CLAUDE.md decision 2 says this
          # dual-backend matrix is what keeps the polars-compatible formulations
          # honest. So this leg forbids conftest.py's own skip reason: if the
          # polars parameter skips here, the job fails.
          - name: polars
            python: "3.12"
            cache: "false"
            sync_args: "--no-default-groups --group test --extra polars"
            expect_imports: "polars"
            absent_imports: "torch;pymc;chainladder"
            forbid_skips: "polars backend not installed"
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_transforms.py;tests/test_mack.py;tests/test_holdout.py;tests/test_polars_extra.py"
            # measured one base earlier (core 553 there): 681 passed, 76
            # skipped - +128 over core, the largest unique contribution of any
            # leg. See the provenance note in the header.
            min_tests: "620"

          # ---------------------------------------------------------------
          # nn: the torch entries, and the leg the whole gate mechanism was
          # written for. Ten of these files guard at MODULE level, so without
          # torch each collapses to a single skip line and every test in it
          # disappears. Both gates cover it from different sides: forbidding
          # "could not import 'torch'" catches the install silently failing,
          # required_files catches a file being renamed or deleted - which no
          # skip reason would ever mention, because a file that does not exist
          # cannot skip.
          #
          # tests/test_fit_atomicity.py and tests/test_tuning.py also use torch
          # but guard at function level, so they collect everywhere and are
          # deliberately NOT in required_files: they would satisfy it even with
          # torch missing.
          #
          # required_files names all ten module-guarded files, not the six that
          # existed when this leg was written. test_nn_training_context.py was
          # already missing from the list then, test_nn_heldout_cutoff.py and
          # test_nn_heldout_premium.py arrived with the fixes this branch rebased
          # onto, and test_nn_segment_contract.py is this branch's own - each one
          # pins a specific NN defect, and an unnamed file is exactly the thing
          # this gate cannot see going away. Any new module-level
          # importorskip("torch") file belongs here too.
          - name: nn
            python: "3.12"
            cache: "true"
            sync_args: "--no-default-groups --group test --extra nn"
            expect_imports: "torch"
            absent_imports: "polars;pymc;chainladder;jax"
            forbid_skips: ""
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_deeptriangle.py;tests/test_mdn.py;tests/test_nn_features.py;tests/test_nn_heldout.py;tests/test_nn_heldout_cutoff.py;tests/test_nn_heldout_premium.py;tests/test_nn_segment_contract.py;tests/test_nn_training_context.py;tests/test_nn_transformer.py;tests/test_nn_transformer_ml.py;tests/test_resnet.py;tests/test_tlrn.py"
            # measured one base earlier (core 553 there): 690 passed, 253
            # skipped - +137 over core, still smaller than the number of tests
            # in those files,
            # because this leg has no polars and many of them are parametrized
            # over both backends. The +137 is up from +97 when this leg landed:
            # the two NN fixes this branch rebased onto brought 614 lines of new
            # tests with them. The floor keeps a cushion and is not raised for
            # the two tlrn files; their required_files entries are what hold
            # them, and a floor is the blunter of the two checks.
            min_tests: "590"

          # ---------------------------------------------------------------
          # jax: the [jax] extra by itself, which is torch plus jax (tlrn's
          # optional JAX training backend). Without this leg jax only reached
          # CI through numpyro on the all leg, so a [jax] extra that stopped
          # declaring jax, or declared one the backend cannot run on, would
          # still have passed there. Here the extra is the ONLY source of jax:
          # numpyro and pymc must be absent, so jax cannot arrive through them.
          #
          # tests/test_tlrn_jax.py skips at module level without jax (or torch),
          # so required_files is what makes this leg check anything: it has to
          # execute here. tests/test_tlrn.py is named too, because the [jax]
          # extra must still carry everything the torch path needs.
          - name: jax
            python: "3.12"
            cache: "true"
            sync_args: "--no-default-groups --group test --extra jax"
            expect_imports: "torch;jax"
            absent_imports: "polars;pymc;numpyro;chainladder"
            forbid_skips: ""
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_tlrn.py;tests/test_tlrn_jax.py"
            # NOT measured on its own: copied from the nn leg, which this leg
            # contains (the [jax] extra installs torch, so every nn test runs
            # here as well, plus test_tlrn_jax.py). It sits above the core
            # count for the same reason the nn floor does. Re-measure from the
            # first CI run's "PASTE-BACK: this leg executed N tests" line.
            min_tests: "590"

          # ---------------------------------------------------------------
          # bayesian: numpyro, pymc, arviz and bayesblend. cmdstanpy installs
          # here too but cmdstan itself does NOT, so the Stan tests stay behind
          # the `slow` marker that pyproject's addopts already excludes - this
          # leg exercises the PPL ports and the stacking kernel, not Stan.
          #
          # All twelve files guard at FUNCTION level, so they never
          # collection-skip and a "not collection-skipped" rule would be
          # vacuous here. Naming all twelve in required_files is what makes the
          # gate meaningful: the rule is "at least one executed test per named
          # file", which covers both skip shapes.
          - name: bayesian
            python: "3.12"
            cache: "true"
            sync_args: "--no-default-groups --group test --extra bayesian"
            expect_imports: "numpyro;pymc;arviz;bayesblend"
            absent_imports: "torch;polars;chainladder"
            forbid_skips: ""
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_heldout_scorer_ccl.py;tests/test_heldout_scorer_compartmental.py;tests/test_heldout_scorer_csr.py;tests/test_heldout_scorer_guszcza.py;tests/test_nuts_sampler.py;tests/test_parity_clark.py;tests/test_parity_compartmental.py;tests/test_parity_meyers.py;tests/test_parity_meyers_csr.py;tests/test_parity_odp.py;tests/test_predicts_heldout_odp_clark.py;tests/test_stacking.py"
            # measured one base earlier: 598 passed, 159 skipped, against a core
            # leg of 553 in the same sweep - so this extra is worth +45, and on
            # this tree, where core is 557, the leg should land near 602.
            # required_files, naming all twelve files, remains the PRIMARY guard
            # here and is what makes this leg's gate real.
            #
            # The floor is the backstop for the one collapse required_files
            # cannot see: files that still exist and still collect, but whose
            # bayesian content has been gutted. For it to check anything at all
            # it has to sit ABOVE the core baseline, because deleting every
            # bayesian test drops this leg back to core's count - a floor at or
            # below 557 is satisfied by an environment with no bayesian tests in
            # it whatsoever, which is the state this leg exists to catch. 575
            # splits the 45-test gap: 18 above the core count measured here, 23
            # below where this leg measured, both far larger than the 1-test
            # local/runner difference noted on the core leg.
            #
            # So this floor is NOT a delta check and must not be tuned like one,
            # but it is the one floor in this file that goes stale in a specific
            # direction: every CORE test added pushes 557 up towards 575, and
            # when that margin is gone the line silently stops meaning anything.
            # Re-measure both numbers together and re-split the gap. The first
            # CI run on this branch prints both ("PASTE-BACK: this leg executed
            # N tests"), which is the cheapest place to take them from.
            min_tests: "575"

          # ---------------------------------------------------------------
          # interop: chainladder and bermuda-ledger, which back the `to_*`
          # converters and every tie-out. CLAUDE.md calls interop sacred - the
          # round-trips must be lossless - and these tests are the only thing
          # checking that claim.
          - name: interop
            python: "3.12"
            cache: "false"
            sync_args: "--no-default-groups --group test --extra interop"
            expect_imports: "chainladder;bermuda"
            absent_imports: "torch;polars;pymc"
            forbid_skips: ""
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_clark.py;tests/test_odp_contract.py;tests/test_tieout_chainladder.py;tests/test_interop_bermuda.py"
            # measured one base earlier (core 553 there): 582 passed, 207
            # skipped. Only +29 over core, and the skip count goes UP (204 ->
            # 207) because
            # three files that were one collection-skip each now collect and
            # skip a few tests individually. required_files is what protects
            # this leg; the floor alone could not.
            min_tests: "530"

          # ---------------------------------------------------------------
          # all: everything installed, and the only leg where the cross-extra
          # combinations run at all - the chainladder tie-outs against the
          # polars backend, and the nn entries against both backends. It is also
          # the only leg that makes the strong claim, so it runs strict: any
          # skip whose reason is not named below fails the job.
          #
          # The allowlist is deliberately short and every entry is a fact about
          # the RUNNER, not about the code. Measured: with every extra
          # installed the suite skips exactly 7 tests, and all 7 say "CAS
          # Schedule P gold mart not reachable" (two wordings, both containing
          # "gold mart"). So:
          #
          #   - "gold mart"  the 7 measured skips - the mart is not on a runner
          #                  (see IBNR_SCHEDULE_P_WAREHOUSE above)
          #   - "cmdstan"    belt and braces for the mart+cmdstan test, whose
          #                  reason already contains "gold mart" today.
          #
          # A "gh CLI" entry used to sit here, for a live-fetch test that was
          # gated on `gh auth status` and therefore ran on the dev box and
          # skipped on a runner. That test now carries the `network` marker and
          # is DESELECTED by addopts everywhere, so it produces no skip on any
          # machine and the entry was removed rather than left to rot: an
          # allowlist entry that can never match teaches a future reader a
          # behaviour that no longer exists.
          #
          # If this leg goes red on a skip reason not listed here, that is the
          # gate working. Read the reason it prints, and either fix the cause or
          # add the reason with a note saying why it is a runner fact.
          - name: all
            python: "3.12"
            cache: "true"
            sync_args: >-
              --no-default-groups --group test
              --extra polars --extra nn --extra jax --extra bayesian --extra interop --extra viz
            expect_imports: "torch;jax;polars;pymc;numpyro;arviz;bayesblend;chainladder;bermuda;altair"
            absent_imports: ""
            forbid_skips: ""
            allow_skips: "gold mart;cmdstan"
            strict_skips: "true"
            required_files: "tests/test_transforms.py;tests/test_deeptriangle.py;tests/test_mdn.py;tests/test_resnet.py;tests/test_nn_heldout.py;tests/test_tlrn.py;tests/test_tlrn_jax.py;tests/test_stacking.py;tests/test_tieout_chainladder.py;tests/test_clark.py;tests/test_interop_bermuda.py;tests/test_polars_extra.py;tests/test_import_purity.py;tests/test_codec.py"
            # measured one base earlier: 968 passed, 7 skipped - and the 7 are
            # the allowlisted gold-mart skips above, re-counted rather than
            # assumed. The 7 is the part that must not drift; the total is the
            # part the first CI run refreshes.
            min_tests: "860"

          # ---------------------------------------------------------------
          # THE TWO LEGS BELOW DELIBERATELY DO NOT USE THE LOCKFILE, and they
          # are the only ones that grade what a downstream consumer actually
          # installs. Every leg above runs `uv sync --locked`, so all seven of
          # them grade one resolution: the one in uv.lock, which [tool.uv]
          # override-dependencies deliberately holds at numpy 2.4.6 / pandas
          # 2.3.3 because the extras' stale upstream pins have to be overridden
          # for the repo to run numpy 2 at all. A consumer gets none of that.
          # `pip install ibnr` resolves numpy 2.5.1 and pandas 3.0.5 today, and
          # no lockfile can pin what a resolver decides on someone else's
          # machine - so without these legs the published package's real
          # dependency set is ungraded.
          #
          # They are ALLOWED to break when a new numpy or pandas ships. That
          # break IS the signal, and it arrives here rather than in a user's
          # traceback. Do not "fix" one by pinning it here; fix the code, or add
          # a cap to the dependency set that genuinely needs one, core included
          # (the sqlglot paragraph in the header is the first case).
          #
          # `unlocked` is a separate matrix field rather than a sentinel value
          # in sync_args, because the two install paths take different uv
          # subcommands and a reader must be able to see which one a leg takes
          # without parsing an argument string.
          - name: core-latest
            python: "3.12"
            cache: "false"
            unlocked: "true"
            sync_args: '-e . --group test "numpy>=2" "pandas>=3"'
            expect_imports: ""
            absent_imports: "torch;polars;pymc;numpyro;jax;arviz;bayesblend;chainladder;bermuda;altair"
            forbid_skips: ""
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_core.py;tests/test_transforms.py;tests/test_gallery.py;tests/test_markdown_snippets.py;tests/test_import_purity.py;tests/test_codec.py;tests/test_sqlglot_cap.py"
            # measured one base earlier: 557 passed, 204 skipped on numpy 2.5.1 /
            # pandas 3.0.5 - test for test identical to the locked core leg on
            # numpy 2.4.6 / pandas 2.3.3, which is the useful part of the
            # result: the numpy and pandas generation moves nothing. Both legs
            # gain the same 52 codec tests on this branch.
            min_tests: "500"

          # ---------------------------------------------------------------
          # polars-latest: the second backend on the same floating resolution.
          # polars is the extra a core-only consumer is most likely to add, and
          # it is the one whose 18 dual-backend files carry the largest silent
          # skip risk - so it keeps the locked polars leg's forbid_skips rule.
          - name: polars-latest
            python: "3.12"
            cache: "false"
            unlocked: "true"
            sync_args: '-e ".[polars]" --group test "numpy>=2" "pandas>=3"'
            expect_imports: "polars"
            absent_imports: "torch;pymc;chainladder"
            forbid_skips: "polars backend not installed"
            allow_skips: ""
            strict_skips: "false"
            required_files: "tests/test_transforms.py;tests/test_mack.py;tests/test_holdout.py;tests/test_polars_extra.py;tests/test_sqlglot_cap.py"
            # measured on this tree: 685 passed, 76 skipped on numpy 2.5.1 /
            # pandas 3.0.5. The locked polars leg above reads 681 only because
            # it was measured one base earlier; the +4 is the same four tests
            # the core leg gained, not a difference between the two resolutions.
            min_tests: "620"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python }}"
          # Caching is per-leg and explicit, not inferred from an expression.
          # One cache per leg because with a shared key whichever leg finished
          # first would decide what every other leg gets, and the core leg's
          # cache is worth nothing to the nn leg.
          #
          # It is OFF for the light legs: they install ~25 packages in seconds,
          # inside the noise of a cache restore-plus-save round trip, and seven
          # caches would otherwise compete for the repository's Actions cache
          # budget and evict each other.
          #
          # prune-cache is false deliberately. setup-uv defaults it to TRUE,
          # which runs `uv cache prune --ci` before saving, and that removes
          # PRE-BUILT wheels while keeping only wheels built from source. torch
          # is a pre-built wheel, so under the default the nn and all legs would
          # re-download it on every single run and this cache would not do the
          # one thing it is here for.
          enable-cache: "${{ matrix.cache }}"
          prune-cache: false
          cache-suffix: "${{ matrix.name }}"
          cache-dependency-glob: "uv.lock"

      # `--locked` is the test-job version of the rule lint.yml applies to ruff:
      # one version, in one place, and that place is uv.lock. It installs
      # exactly the locked resolution AND fails when pyproject.toml has drifted
      # from it, so CI can never quietly test a resolution nobody has locally.
      # `--frozen` installs the lockfile without checking it, which is weaker.
      # This matters more for tests than for lint, because a floating numpy or
      # pandas changes numbers, not just formatting.
      #
      # `--no-default-groups --group test` is what makes isolation possible at
      # all: the `dev` group carries polars, chainladder and bermuda right next
      # to pytest, so a plain `uv sync` can never produce a core-only
      # environment. The `test` group holds pytest and ruff and nothing else,
      # exactly as `docs` was carved out so docs.yml could avoid the dev group.
      - name: Install (locked)
        if: matrix.unlocked != 'true'
        run: uv sync --locked ${{ matrix.sync_args }}

      # No lockfile on purpose - see the core-latest comment in the matrix.
      # `uv venv` first so both install paths leave an identical .venv layout
      # for the pytest step, which runs through `uv run --no-sync` either way.
      # --clear because the runner already has a .venv by this point (the
      # setup-uv action's cache restore leaves one) and uv 0.11 ERRORS on an
      # existing venv rather than replacing it - both -latest legs died in 9 s
      # on their first hosted run for exactly this. A fresh venv is the point
      # of these legs, so replacing is correct, not just convenient.
      # `uv pip install` is used rather than `uv sync --no-lock` because it is
      # the only one that takes extra requirements on the command line, which is
      # how these legs force numpy and pandas forward rather than merely
      # allowing them.
      #
      # --no-config is LOAD-BEARING and was measured, not assumed. `uv pip
      # install` run from the project directory reads [tool.uv] out of
      # pyproject.toml, override-dependencies included - so without it this leg
      # inherits the repo's own numpy<2.5 cap and installs numpy 2.4.6, exactly
      # what the seven locked legs already grade. The one thing this leg exists
      # to test would be silently switched off, and it would still be green.
      # Measured on the same command: numpy 2.4.6 with config, 2.5.1 without.
      - name: Install (floating, newest numpy/pandas)
        if: matrix.unlocked == 'true'
        run: |
          uv venv --clear --python ${{ matrix.python }}
          uv pip install --no-config ${{ matrix.sync_args }}

      # Print the resolution rather than infer it from the leg name. On the
      # floating legs this is the only record of what was actually graded, and
      # it is the first thing to read when one of them goes red.
      - name: Record the resolution this leg graded
        run: uv run --no-sync python -c "import numpy, pandas; print('numpy', numpy.__version__, 'pandas', pandas.__version__)"

      # Fail before pytest if the environment is not what this leg claims.
      # Cheap, and its failure message is obvious - which is exactly what a skip
      # is not.
      - name: Check this leg installed what it claims
        env:
          EXPECT_IMPORTS: ${{ matrix.expect_imports }}
          ABSENT_IMPORTS: ${{ matrix.absent_imports }}
        run: |
          uv run --no-sync python - <<'PY'
          import importlib
          import importlib.util
          import os
          import sys


          def names(var):
              return [p.strip() for p in os.environ.get(var, "").split(";") if p.strip()]


          problems = []
          for name in names("EXPECT_IMPORTS"):
              try:
                  module = importlib.import_module(name)
              except Exception as exc:
                  problems.append(f"{name} should be installed here but did not import: {exc}")
              else:
                  print(f"present: {name} {getattr(module, '__version__', '')}")
          for name in names("ABSENT_IMPORTS"):
              if importlib.util.find_spec(name) is None:
                  print(f"absent, as this leg requires: {name}")
              else:
                  problems.append(f"{name} must NOT be installed in this leg, but it is")
          if problems:
              sys.exit("FAIL:\n  " + "\n  ".join(problems))
          PY

      # No `-m` here on purpose. pyproject's addopts already carries
      # -m "not slow", and a `-m` on the command line REPLACES it rather than
      # combining, so a leg written as `pytest -m mart` would quietly pull the
      # cmdstan tests into an environment with no cmdstan. Any future leg
      # needing a marker filter must spell the whole thing out, as in
      # -m "tieout and not slow".
      #
      # --strict-markers turns a typo'd marker into an error instead of a
      # warning. Without it a stray `@pytest.mark.slw` on a cmdstan test escapes
      # the "not slow" exclusion and tries to compile Stan right here.
      #
      # Runs through `uv run` rather than the virtualenv's python directly
      # because `uv run` puts the environment's bin directory on PATH, and
      # tests/test_markdown_snippets.py shells out to `ruff` by name. That is
      # also why ruff is in the `test` group: without it those tests FAIL rather
      # than skip.
      - name: Run pytest
        id: pytest
        run: |
          uv run --no-sync pytest \
            --strict-markers --strict-config \
            -rs --durations=10 \
            --junitxml=junit.xml

      # The gate. Runs even when pytest failed - a leg that fails on a real test
      # failure should still report whether it ALSO skipped things it should not
      # have, because both answers are useful and one must not hide the other.
      #
      # `!cancelled()` rather than `always()`: this workflow enables
      # cancel-in-progress, so with always() every force-push would leave seven
      # cancelled jobs each printing "pytest wrote no junit.xml" - a red,
      # alarming, meaningless step on a run the user intentionally superseded.
      # The outcome check keeps it quiet when Install failed and pytest never
      # ran, so a broken install reports one error rather than two.
      - name: Check the tests this leg exists for actually ran
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        env:
          EXPECT_IMPORTS: ${{ matrix.expect_imports }}
          FORBID_SKIPS: ${{ matrix.forbid_skips }}
          ALLOW_SKIPS: ${{ matrix.allow_skips }}
          STRICT_SKIPS: ${{ matrix.strict_skips }}
          REQUIRED_FILES: ${{ matrix.required_files }}
          MIN_TESTS: ${{ matrix.min_tests }}
          LEG: ${{ matrix.name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("junit.xml")
          if not report.exists():
              sys.exit("FAIL: pytest wrote no junit.xml, so nothing can be verified.")


          def listed(var):
              return [p.strip() for p in os.environ.get(var, "").split(";") if p.strip()]


          # A package this leg installed must never be why a test was skipped.
          # "could not import 'x'" is pytest.importorskip's own wording.
          banned = [f"could not import '{name}'" for name in listed("EXPECT_IMPORTS")]
          banned += listed("FORBID_SKIPS")
          allowed = listed("ALLOW_SKIPS")
          strict = os.environ.get("STRICT_SKIPS", "false").strip().lower() == "true"
          floor = int(os.environ.get("MIN_TESTS", "0"))
          required = listed("REQUIRED_FILES")

          # The skip policy is an EXPLICIT flag, never inferred from whether the
          # allowlist happens to be non-empty. Inferring it would mean emptying
          # one string silently disarms the whole gate on the one leg that makes
          # the strong claim, with no visible difference in the log.
          print(f"leg: {os.environ.get('LEG', '?')}")
          if strict:
              print(f"skip policy: STRICT, allowing {len(allowed)} reason(s): {allowed}")
          else:
              print("skip policy: permissive (isolated leg; some skips are expected)")

          passed = failed = errored = 0
          per_file_ran = {}
          collection_skipped = set()
          offenders = []
          unexpected = []

          for case in ET.parse(report).getroot().iter("testcase"):
              # Verified against pytest 9.0.3: NO testcase carries a `file`
              # attribute, in either shape. A normal test has
              # classname="tests.test_mack" and name="test_x". A module-level
              # importorskip instead emits classname="" with the dotted module
              # in `name` and message="collection skipped", the real reason
              # living in the element TEXT - which is why reason searches both.
              classname = case.get("classname") or ""
              name = case.get("name") or ""
              skipped = case.find("skipped")

              if skipped is None:
                  # Counted separately so the summary cannot print a reassuring
                  # "N tests executed" that is really N failures.
                  if case.find("error") is not None:
                      errored += 1
                  elif case.find("failure") is not None:
                      failed += 1
                  else:
                      passed += 1
                  if classname:
                      per_file_ran[classname] = per_file_ran.get(classname, 0) + 1
                  continue

              if not classname:
                  collection_skipped.add(name)

              reason = f"{skipped.get('message') or ''} {skipped.text or ''}"
              where = "::".join(p for p in (classname, name) if p) or "unknown test"
              hit = next((phrase for phrase in banned if phrase in reason), None)
              if hit is not None:
                  offenders.append(f"  {where}\n      skipped for: {hit}")
              elif strict and not any(phrase in reason for phrase in allowed):
                  unexpected.append(f"  {where}\n      skipped for: {reason.strip()[:160]}")

          executed = passed + failed
          print(f"{passed} passed, {failed} failed, {errored} errors; floor is {floor}")
          print(f"PASTE-BACK: this leg executed {executed} tests (passed+failed)")

          problems = []
          if offenders:
              problems.append(
                  f"{len(offenders)} test(s) skipped for a package THIS LEG INSTALLED:\n"
                  + "\n".join(offenders[:25])
              )
          if unexpected:
              problems.append(
                  f"{len(unexpected)} test(s) skipped for a reason this leg does not allow:\n"
                  + "\n".join(unexpected[:25])
              )

          # The gate with real teeth. A global floor cannot notice that one file
          # vanished, because ~553 core tests run in every leg and drown the
          # difference - the bayesian extra's entire unique contribution is 45.
          missing = []
          for path in required:
              module = path.replace("/", ".").replace("\\", ".").removesuffix(".py")
              if module in collection_skipped:
                  missing.append(f"  {path}: COLLECTION-SKIPPED (module-level importorskip fired)")
              elif per_file_ran.get(module, 0) == 0:
                  missing.append(
                      f"  {path}: contributed ZERO executed tests (renamed? deleted? all skipped?)"
                  )
          if missing:
              problems.append(
                  "file(s) this leg exists to exercise ran nothing:\n" + "\n".join(missing)
              )

          if executed < floor:
              problems.append(
                  f"only {executed} tests executed, below this leg's floor of {floor}. Either the "
                  "environment is wrong, or tests were removed and the floor needs updating."
              )
          if problems:
              sys.exit("FAIL: " + "\n\n".join(problems))
          print("OK: this leg ran the tests it exists to run.")
          PY

      # Worth keeping: the log shows the first 25 offenders, the report has all
      # of them, and skip reasons are the thing you want to read after the fact.
      - name: Save the test report
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.name }}
          path: junit.xml
          if-no-files-found: warn
