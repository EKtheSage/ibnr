[project]
name = "ibnr"
version = "0.2.0"
description = "Gallery-centric probabilistic loss reserving: Bayesian MCMC and neural network methods with mandatory evaluation, over a long-format triangle data layer."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11"
authors = [{ name = "Ethan Kang", email = "ethan.yskang@gmail.com" }]
keywords = [
    "actuarial",
    "loss-reserving",
    "reserving",
    "ibnr",
    "insurance",
    "bayesian",
    "mcmc",
    "probabilistic",
    "triangle",
    "chainladder",
]
# No "License ::" classifier: `license` above is an SPDX expression (PEP 639),
# and hatchling rejects declaring the license both ways.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ibis-framework[duckdb,polars]>=9.5",
    "numpy>=1.26",
    "pandas>=2",
    "scipy>=1.11",
]

[project.optional-dependencies]
bayesian = ["cmdstanpy", "numpyro", "pymc", "arviz", "bayesblend"]
nn = ["torch>=2.2"]
viz = ["altair"]

[project.urls]
Homepage = "https://github.com/EKtheSage/probabilistic-ml-reserving"
Repository = "https://github.com/EKtheSage/probabilistic-ml-reserving"
Issues = "https://github.com/EKtheSage/probabilistic-ml-reserving/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "chainladder>=0.8.18",
    "bermuda-ledger>=2.3",
    "pandas>=2",
    "pyarrow>=15",
    # analysis notebooks (analysis/*.ipynb); matplotlib comes via chainladder/arviz
    "jupyterlab>=4",
    "nbconvert>=7",
    "nbformat>=5",
    "ipykernel>=6",
]
# Documentation site (Quarto-based; needs the `quarto` CLI installed separately).
# Build with: uv run --group docs great-docs build
docs = ["great-docs>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibnr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""  # slow (cmdstan) tests run explicitly: pytest -m slow
markers = [
    "tieout: results match chainladder-python on raa/clrd samples",
    "parity: cross-backend posterior matching",
    "slow: cmdstan compilation; separate CI job",
    "mart: requires the local CAS Schedule P gold mart",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# exploratory notebooks: allow notebook idiom (display lines, plt semicolons)
"analysis/*.ipynb" = ["B905", "UP031", "E501", "E702"]
