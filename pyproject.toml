[project]
name = "ibnr"
version = "0.5.1"
description = "Gallery-centric probabilistic loss reserving: Bayesian MCMC and neural network methods with mandatory evaluation, over a long-format triangle data layer."
readme = "README.md"
license = "MPL-2.0"
# The CEILING is the whole Python-version policy in one place, and it is
# deliberate (Ethan, 2026-07-28). Core, [polars], [nn] and [viz] resolve
# WHEELS-ONLY on 3.13 and 3.14 - measured on this wheel against
# x86_64-manylinux_2_28, not assumed - but [bayesian] and [interop] cannot
# follow (see the extras below; they fail wheels-only on both), and packaging
# metadata has no way to say "3.11-3.14 unless you asked for [interop]". So the
# package claims one range for everything it ships, and a 3.13 user gets the
# standard "requires a different Python" refusal at resolve time instead of a
# broken install or a ModuleNotFoundError at import - measured on a clean 3.13
# venv: pip says `Package 'ibnr' requires a different Python: 3.13.13 not in
# '<3.13,>=3.11'`. Lift the cap when bayesblend and bermuda-ledger move.
requires-python = ">=3.11,<3.13"
authors = [{ name = "Ethan Kang", email = "ethan.yskang@gmail.com" }]
keywords = [
    "actuarial",
    "loss-reserving",
    "reserving",
    "ibnr",
    "insurance",
    "bayesian",
    "mcmc",
    "probabilistic",
    "triangle",
    "chainladder",
]
# No "License ::" classifier: `license` above is an SPDX expression (PEP 639),
# and hatchling rejects declaring the license both ways.
#
# The classifiers say exactly what requires-python says, and no more. They are
# NOT a statement about what the core could do on its own - core, [polars],
# [nn] and [viz] were measured resolving wheels-only on 3.11 through 3.14 - but
# advertising a version the installer then refuses is worse than claiming less
# than the code can do.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # duckdb only. The polars backend pulls a ~176 MB runtime that a duckdb-only
    # user never executes, so it lives in the `polars` extra below. Both backends
    # remain first-class and are tested together (see the dev group).
    #
    # The <13 ceiling is the tested one, not a guess: 12.0.0 is what uv.lock
    # resolves and what every CI leg runs. ibis has broken us across majors
    # before - the polars backend's total absence of window functions
    # (CLAUDE.md gotchas) is an ibis 10.x fact that transforms.py is written
    # around - so a major bump has to be a deliberate change with the
    # dual-backend suite re-run, not something a fresh resolve does silently.
    "ibis-framework[duckdb]>=9.5,<13",
    # Deliberately NOT numpy>=2, even though numpy 2 is what we want and what
    # this repo now locks (see [tool.uv] below). This floor ALREADY resolves to
    # numpy 2.x for a plain `pip install ibnr`; the numpy 1.26.4 that used to
    # appear in uv.lock was a property of THIS repo's environment, where the
    # [interop] and [bayesian] extras resolve alongside the core and drag their
    # transitive numpy<2 caps in. Raising the floor to 2 would buy a core user
    # nothing they do not already have and would make `pip install
    # ibnr[interop]` and `ibnr[bayesian]` unsatisfiable, because bermuda-ledger
    # 2.3.0 and arviz 0.18.0 both cap numpy below 2 and both are the newest
    # releases of their projects. Re-measured on this tree, core-only, on the
    # two resolutions that matter: 557 passed / 0 failed on the locked numpy
    # 2.4.6 + pandas 2.3.3, and the same 557 / 0 on numpy 2.5.1 + pandas 3.0.5,
    # which is what an unpinned `pip install ibnr` resolves today. Test for
    # test identical - the numpy generation does not move a single result.
    "numpy>=1.26",
    "pandas>=2",
    # Declared, not added: ibis-framework[duckdb] already requires pyarrow>=10.0.1,
    # so every install has had it all along. kernels/codec.py imports it directly
    # rather than through ibis, and a direct import belongs in the direct
    # dependencies - an inherited one can be dropped by an upstream release note.
    # The floor matches the one the dev group already pinned.
    "pyarrow>=15",
    "scipy>=1.11",
]

[project.optional-dependencies]
# The second ibis backend. Only needed to pass backend="polars"; duckdb is the
# default and covers every code path on its own. Ceiling as for the core dep.
polars = ["ibis-framework[polars]>=9.5,<13"]
#
# ---------------------------------------------------------------------------
# THESE TWO EXTRAS ARE WHY requires-python STOPS BELOW 3.13, and it is the same
# reason twice. Both [bayesian] and [interop] transitively pin numpy below 2 -
# arviz 0.18.0 (pulled by bayesblend 0.0.8's arviz>=0.18,<0.19) and
# bermuda-ledger 2.3.0 respectively. The newest numpy under 2 is 1.26.4, which
# has no cp313 wheel and whose source does not support 3.13 at all. Neither
# extra can be made to work there by any pin we could write.
#
# The ceiling therefore lives on requires-python, where it is ONE mechanism and
# produces the installer's own "requires a different Python" error, rather than
# on these two extras, where nothing expresses it honestly: a per-extra marker
# ALONE is a silent no-op (on 3.13 the extra resolves WITHOUT bayesblend, or
# without bermuda, and the user meets a ModuleNotFoundError at import), and
# leaving the dependency unmarked only makes the resolver complain under
# --only-binary - with sdists allowed, which is what plain `pip install` does,
# it resolves happily to unbuildable numpy 1.26.4 sources and fails minutes
# later inside cc. Both measured.
#
# The rejected alternative, recorded so it is not re-invented: put the
# complementary marker on a dependency whose name is deliberately unregistered,
# so 3.13 fails to resolve with a message naming its own reason. It was built
# and measured on this branch and it does work - but only while nobody else
# uploads that name, and a squatter turns a clean error into a wrong install.
# Ethan's call, 2026-07-28: cap requires-python instead and claim less.
# ---------------------------------------------------------------------------
#
# bayesblend is pinned to 0.0.x: kernels/stacking.py is written against its
# 0.0.8 API (Draws.from_lpd, the four fitter classes, the weights property),
# which a 0.1 release is free to break.
#
# arviz<1 and pymc<6 are MEASURED breaks, not caution. arviz 1.x is the
# arviz-base/arviz-stats/arviz-plots rewrite and drops the
# az.from_dict(posterior=...) signature the parity tests are written against;
# pymc 6.x changed LKJCorrRV.rv_op and fails
# test_lkj1_gives_uniform_correlation[pymc]. Neither cap is visible today only
# because bayesblend's own arviz>=0.18,<0.19 holds the resolution down - the day
# that pin moves, both land silently on a consumer.
#
# Note for anyone reading the wheel-tag story: on 3.12 this extra installs but
# does NOT install wheels-only, because bayesblend pins matplotlib==3.7.2, whose
# newest wheel is cp311. 3.12 builds it from source (CI does exactly this and is
# green); 3.11 is the last version that needs no compiler.
bayesian = [
    "cmdstanpy",
    "numpyro",
    "pymc<6",
    "arviz<1",
    "bayesblend>=0.0.8,<0.1",
]
nn = ["torch>=2.2"]
viz = ["altair"]
# Needed only to convert OUT to these libraries (`to_chainladder`/`to_bermuda`).
# Reading FROM them takes a foreign object the caller already built, so it needs
# no dependency of ours.
#
# The chainladder floor is 0.9.2, raised from 0.8.18, because the old floor let
# `pip install ibnr[interop]` resolve 0.8.26 - which is NOT the version every
# tieout in this repo was validated against. A floor whose resolution nobody has
# ever run the suite on is not a floor.
interop = [
    "chainladder>=0.9.2",
    "bermuda-ledger>=2.3",
]

[project.urls]
Homepage = "https://github.com/EKtheSage/ibnr"
Repository = "https://github.com/EKtheSage/ibnr"
Documentation = "https://ekthesage.github.io/ibnr/"
Issues = "https://github.com/EKtheSage/ibnr/issues"

[dependency-groups]
# Just enough to RUN the suite, and nothing optional. This is what lets CI build
# a genuinely core-only environment: `uv sync --no-default-groups --group test`.
# The dev group cannot do that job, because it carries polars, chainladder and
# bermuda alongside pytest - syncing it installs three of the optional extras,
# and the "core and each extra in isolation" matrix becomes impossible to
# express. Same reason `docs` was carved out for docs.yml.
#
# ruff is here, not in dev, because tests/test_markdown_snippets.py shells out
# to a `ruff` binary by name: without it those tests FAIL rather than skip. It
# cannot contaminate the core-isolation proof - ruff is a standalone binary and
# no python module imports it.
#
# 0.16 is the floor because its formatter is the first to reach the python code
# blocks inside markdown (README, model cards), which the CI lint job checks. An
# older ruff would leave those blocks unformatted and then disagree with CI.
# tests/test_lint_pins.py keeps this floor, the lockfile and the version CI runs
# in agreement, and asserts the floor is declared exactly ONCE across all groups.
test = ["pytest>=8", "ruff>=0.16"]
dev = [
    # dev is test plus everything a contributor needs; the floors above are not
    # repeated here, so there is still only one place to bump them.
    { include-group = "test" },
    # polars is optional for users but REQUIRED for development: the transform
    # suite runs against both backends, and that matrix is what keeps the
    # polars-compatible formulations honest (CLAUDE.md #2).
    "ibis-framework[polars]>=9.5,<13",
    "chainladder>=0.9.2",
    "bermuda-ledger>=2.3",
    "pandas>=2",
    # analysis notebooks (analysis/*.ipynb); matplotlib comes via chainladder/arviz
    "jupyterlab>=4",
    "nbconvert>=7",
    "nbformat>=5",
    "ipykernel>=6",
]
# Documentation site (Quarto-based; needs the `quarto` CLI installed separately).
# Build with: uv run --group docs great-docs build
docs = ["great-docs>=0.15"]

[tool.uv]
# Overrides apply to THIS project's own resolution only. They are a uv concept
# and never reach the published metadata - the wheel still declares exactly what
# [project] says above, and nothing more. That separation is the whole point:
# it lets the dev environment and CI run the numpy the core dependency already
# resolves to for a consumer, without shipping metadata that cannot be satisfied.
#
# Every version override below is a STALE upstream pin on code that works, and
# each was verified by running the suite rather than by reading changelogs. The
# two per-override counts are the ones measured when the override was added and
# are not re-run on every change - what they record is "0 failed", not a total
# to compare against today's suite, which has grown since:
#   bermuda-ledger 2.3.0 declares numpy<2,>1.23.1   -> 570 passed / 0 failed on 2.4.6
#   arviz 0.18.0 (via bayesblend) declares numpy<2  -> 586 passed / 0 failed on 0.23.4
#   bayesblend 0.0.8 declares matplotlib==3.7.2     -> that wheel is numpy-1 ABI and
#       dies with "numpy.core.multiarray failed to import" the moment numpy 2 is
#       present; 3.11.1 is fine, and it is a WHEEL on 3.12 rather than a source
#       build. All extras together on these overrides: 968 passed / 0 failed
#       (measured one base earlier, when core stood at 553 against 557 here -
#       the "0 failed" is the claim, the total moves with main).
# One upgrade was NOT optional and is worth knowing before anyone pins pymc
# back: pytensor 2.31.7 unpacks numpy's einsum_path result as a 5-tuple, numpy
# 2.4 returns 3, and every LKJ-based compartmental test dies on
# "not enough values to unpack". pymc 5.28.5 / pytensor 2.38.3 fix it, so the
# lock carries them and the bayesian leg is 598 passed / 0 failed there (same
# sweep as the 968 above, so the same caveat applies to the total).
# The right long-term fix is upstream (bermuda: drop numpy<2; bayesblend: drop
# arviz<0.19 and the exact matplotlib pin); this is the local bridge until then.
#
# The numpy override is a FLOOR of 2, not just permission to reach it. Written
# as the permissive `numpy>1.23.1,<2.5` it changed nothing: an override widens
# what is allowed, and uv then prefers the version already in the lockfile, so
# a re-lock sat right back down on 1.26.4. The whole point of this block is that
# development and CI run the numpy generation a consumer already gets, so the
# floor says so and cannot quietly regress. The <2.5 ceiling is numba's real cap
# (numpy<2.5), inherited through chainladder -> sparse; drop it when numba
# supports 2.5.
#
# Every entry here is a version override and nothing else. Two more used to sit
# below, neutralising deliberately unregistered sentinel packages the extras
# declared under a `python_version >= '3.13'` marker; that design is gone (see
# the note above [project.optional-dependencies]) and so are they.
override-dependencies = [
    "numpy>=2,<2.5",
    "arviz>=0.23,<1",
    "matplotlib>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibnr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""  # slow (cmdstan) tests run explicitly: pytest -m slow
markers = [
    "tieout: results match an external reference - chainladder-python on raa/clrd, or R ChainLadder's published CDR output",
    "parity: cross-backend posterior matching",
    "slow: cmdstan compilation; separate CI job",
    "mart: requires the local CAS Schedule P gold mart",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# exploratory notebooks: allow notebook idiom (display lines, plt semicolons)
"analysis/*.ipynb" = ["B905", "UP031", "E501", "E702"]
